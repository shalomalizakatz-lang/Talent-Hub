services:
  - type: web
    name: talent-hub
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talent-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SHARED_PASSWORD
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"

databases:
  - name: talent-hub-db
    plan: starter
    # Render's managed Postgres includes automated daily backups on all
    # paid plans — required here since this table holds candidate PII.
